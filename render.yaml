services:
  - type: web
    name: code-server
    runtime: docker
    plan: starter

    # Run container as root
    dockerUser: root

    # If using Dockerfile in repo root
    dockerfilePath: ./Dockerfile

    env:
     - key: PUID
        value: 0
        
      - key: PGID
        value: 0
        
      - key: TZ
        value: Etc/UTC

      - key: PASSWORD
        generateValue: true

      - key: SUDO_PASSWORD
        generateValue: true

      - key: DEFAULT_WORKSPACE
        value: /config/workspace

      - key: PWA_APPNAME
        value: code-server

    disk:
      name: code-server-data
      mountPath: /config
      sizeGB: 10

    healthCheckPath: /
